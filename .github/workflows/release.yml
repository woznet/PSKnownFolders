name: Release

# Builds the module and packages it as PSKnownFolders.<version>.zip, containing the
# PSKnownFolders/ module folder.
# - Pull requests: build and package only, uploaded as a workflow artifact for review.
# - Manual run (Actions tab > Release > Run workflow) on main: also tags the commit
#   v<version> and publishes a GitHub release with the zip attached.
# The version comes from <Version> in src/PSKnownFolders.csproj, and must match
# ModuleVersion in src/ModuleFiles/PSKnownFolders.psd1.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'PSKnownFolders.sln'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only; do not tag or publish a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PSKnownFolders.csproj)
          if [ -z "$version" ]; then
            echo "::error file=src/PSKnownFolders.csproj::No <Version> found"
            exit 1
          fi
          manifest_version=$(sed -n "s/^[[:space:]]*ModuleVersion[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" src/ModuleFiles/PSKnownFolders.psd1)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error file=src/ModuleFiles/PSKnownFolders.psd1::ModuleVersion '$manifest_version' does not match csproj Version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build src/PSKnownFolders.csproj -c Release

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Zip from the repo root so every entry sits under PSKnownFolders/,
          # ready to extract straight into a PSModulePath directory.
          zip -X "$GITHUB_WORKSPACE/PSKnownFolders.$VERSION.zip" \
            PSKnownFolders/PSKnownFolders.dll \
            PSKnownFolders/PSKnownFolders.pdb \
            PSKnownFolders/PSKnownFolders.psd1 \
            PSKnownFolders/PSKnownFolders.format.ps1xml \
            PSKnownFolders/PSKnownFolders.xml
          unzip -l "$GITHUB_WORKSPACE/PSKnownFolders.$VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: PSKnownFolders.${{ steps.version.outputs.version }}
          path: PSKnownFolders.${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are published from main only (this run is on $GITHUB_REF)"
          exit 1

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Bump <Version> and ModuleVersion first."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump <Version> and ModuleVersion first."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: PSKnownFolders.${{ needs.build.outputs.version }}

      - name: Publish release
        run: |
          gh release create "v$VERSION" "PSKnownFolders.$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
